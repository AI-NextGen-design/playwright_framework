
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:

  # 1. Configure Java 17
  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  # 2. Build Maven project
  - script: mvn -B -DskipTests package
    displayName: Build Maven project

  # 3. Install Playwright Chromium and Linux dependencies
  - script: >
      mvn -B exec:java
      -Dexec.mainClass=com.microsoft.playwright.CLI
      -Dexec.args="install --with-deps chromium"
    displayName: Install Playwright Chromium

  # 4. Execute tests and generate Allure report
  - script: mvn -B clean verify -Dci=true
    displayName: Run tests and generate Allure report

  # 5. Diagnose execution artifacts and detect available outputs
  - script: |
      echo "===== SUREFIRE REPORTS ====="
      find target/surefire-reports -type f -print 2>/dev/null || true

      echo "===== ALLURE RESULTS ====="
      find allure-results -type f -print 2>/dev/null || true

      echo "===== ALLURE HTML REPORT ====="
      find target/allure-report -type f -print 2>/dev/null || true

      echo "===== SCREENSHOTS ====="
      find target/screenshots -type f -print 2>/dev/null || true

      echo "===== VIDEOS ====="
      find target/failure-videos -type f -print 2>/dev/null || true

      # Detect real PNG screenshots
      if find target/screenshots -type f -name '*.png' | grep -q .; then
        echo "##vso[task.setvariable variable=hasScreenshots]true"
      else
        echo "##vso[task.setvariable variable=hasScreenshots]false"
      fi

      # Detect real WebM videos
      if find target/failure-videos -type f -name '*.webm' | grep -q .; then
        echo "##vso[task.setvariable variable=hasVideos]true"
      else
        echo "##vso[task.setvariable variable=hasVideos]false"
      fi

      # Detect Allure result JSON files
      if find allure-results -type f -name '*-result.json' | grep -q .; then
        echo "##vso[task.setvariable variable=hasAllureResults]true"
      else
        echo "##vso[task.setvariable variable=hasAllureResults]false"
      fi

      # Detect generated Allure HTML report
      if [ -f target/allure-report/index.html ]; then
        echo "##vso[task.setvariable variable=hasAllureHtml]true"
      else
        echo "##vso[task.setvariable variable=hasAllureHtml]false"
      fi

    displayName: Diagnose execution artifacts
    condition: always()

  # 6. Publish TestNG results
  - task: PublishTestResults@2
    displayName: Publish TestNG results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      searchFolder: '$(Build.SourcesDirectory)'
      failTaskOnFailedTests: false

  # 7. Publish failure screenshots
  - task: PublishPipelineArtifact@1
    displayName: Publish Failure Screenshots
    condition: and(always(), eq(variables['hasScreenshots'], 'true'))
    inputs:
      targetPath: '$(Build.SourcesDirectory)/target/screenshots'
      artifact: 'failure-screenshots'
      publishLocation: pipeline

  # 8. Publish failure videos
  - task: PublishPipelineArtifact@1
    displayName: Publish Failure Videos
    condition: and(always(), eq(variables['hasVideos'], 'true'))
    inputs:
      targetPath: '$(Build.SourcesDirectory)/target/failure-videos'
      artifact: 'failure-videos'
      publishLocation: pipeline

  # 9. Publish Allure HTML report as downloadable artifact
  - task: PublishPipelineArtifact@1
    displayName: Publish Allure HTML report
    condition: and(always(), eq(variables['hasAllureHtml'], 'true'))
    inputs:
      targetPath: '$(Build.SourcesDirectory)/target/allure-report'
      artifact: 'allure-report'
      publishLocation: pipeline

  # 10. Display Allure report inside Azure DevOps
  - task: PublishAllureReport@2
    displayName: Publish Allure report
    condition: and(always(), eq(variables['hasAllureResults'], 'true'))
    inputs:
      testResultsDir: '$(Build.SourcesDirectory)/allure-results'
      reportName: 'Playwright Test Report'
      allureVersion: '2.36.0'