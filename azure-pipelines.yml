
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  # Java 17
  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  # Build Maven project
  - script: mvn -B -DskipTests package
    displayName: Build Maven project

  # Install Playwright Chromium
  - script: >
      mvn -B exec:java
      -Dexec.mainClass=com.microsoft.playwright.CLI
      -Dexec.args="install --with-deps chromium"
    displayName: Install Playwright Chromium

  # Execute tests and generate Allure report
  - script: mvn -B clean verify
    displayName: Run tests and generate Allure report

  # Diagnose Allure results
  - script: |
      echo "Checking Allure results directory..."
      ls -la "$(Build.SourcesDirectory)"
      echo "Allure result files:"
      find "$(Build.SourcesDirectory)" -type f -name "*-result.json" -print
    displayName: Check Allure result files
    condition: always()

  # Publish TestNG results
  - task: PublishTestResults@2
    displayName: Publish TestNG results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      searchFolder: '$(Build.SourcesDirectory)'
      failTaskOnFailedTests: false

  # Publish HTML report as downloadable artifact
  - task: PublishPipelineArtifact@1
    displayName: Publish Allure HTML report
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/target/allure-report'
      artifact: 'allure-report'
      publishLocation: pipeline

  # Display Allure report inside Azure DevOps
  - task: PublishAllureReport@2
    displayName: Publish Allure report
    condition: succeededOrFailed()
    inputs:
      testResultsDir: '$(Build.SourcesDirectory)/allure-results'
      reportName: 'Playwright Test Report'
      allureVersion: '2.36.0'