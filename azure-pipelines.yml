
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:

  # 1. Configure Java 17
  - task: JavaToolInstaller@0
    displayName: Use Java 17
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  # 2. Build Maven project
  - script: mvn -B -DskipTests package
    displayName: Build Maven project

  # 3. Install Playwright Chromium and Linux dependencies
  - script: >
      mvn -B exec:java
      -Dexec.mainClass=com.microsoft.playwright.CLI
      -Dexec.args="install --with-deps chromium"
    displayName: Install Playwright Chromium

  # 4. Execute tests and generate Allure report
  - script: mvn -B clean verify -Dci=true
    displayName: Run tests and generate Allure report

  # 5. Diagnose generated files
  - script: |
      echo "===== SUREFIRE REPORTS ====="
      find target/surefire-reports -type f -print || true

      echo "===== ALLURE RESULTS ====="
      find allure-results -type f -print || true

      echo "===== ALLURE HTML REPORT ====="
      find target/allure-report -type f -print || true

      echo "===== SCREENSHOTS ====="
      find target/screenshots -type f -print || true

      echo "===== VIDEOS ====="
      find target/failure-videos -type f -print || true
    displayName: Diagnose execution artifacts
    condition: always()

  # 6. Publish TestNG results
  - task: PublishTestResults@2
    displayName: Publish TestNG results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      searchFolder: '$(Build.SourcesDirectory)'
      failTaskOnFailedTests: false

  # 7. Prepare evidence directories
  - script: |
      mkdir -p target/screenshots
      mkdir -p target/failure-videos
    displayName: Prepare evidence directories
    condition: always()

  # 8. Publish failure screenshots
  - task: PublishPipelineArtifact@1
    displayName: Publish Failure Screenshots
    condition: always()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/target/screenshots'
      artifact: 'failure-screenshots'
      publishLocation: pipeline

  # 9. Publish failure videos
  - task: PublishPipelineArtifact@1
    displayName: Publish Failure Videos
    condition: always()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/target/failure-videos'
      artifact: 'failure-videos'
      publishLocation: pipeline

  # 10. Publish Allure HTML report as downloadable artifact
  - task: PublishPipelineArtifact@1
    displayName: Publish Allure HTML report
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.SourcesDirectory)/target/allure-report'
      artifact: 'allure-report'
      publishLocation: pipeline

  # 11. Display Allure report inside Azure DevOps
  - task: PublishAllureReport@2
    displayName: Publish Allure report
    condition: succeededOrFailed()
    inputs:
      testResultsDir: '$(Build.SourcesDirectory)/allure-results'
      reportName: 'Playwright Test Report'
      allureVersion: '2.36.0'